<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Netlify form detection</title>
  </head>
  <body>
    <!--
      Static stub so Netlify's build-time crawler registers the "contact" form.
      Next.js SSR pages aren't scanned, so every field the React enquiry form
      submits must be listed here once, with matching `name` attributes.
      Do not link to this page; it exists only for form detection.
    -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="full-name" />
      <input type="text" name="country" />
      <input type="email" name="email" />
      <input type="tel" name="whatsapp" />
      <input type="text" name="destination" />
      <input type="text" name="tradition" />
      <input type="text" name="date" />
      <input type="text" name="guests" />
      <input type="text" name="budget" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>
    <form name="newsletter" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="email" name="email" />
      <input type="text" name="bot-field" />
    </form>
  </body>
</html>
